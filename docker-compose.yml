services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: companheiros
      POSTGRES_PASSWORD: companheiros
      POSTGRES_DB: companheiros
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companheiros"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
